# URL allow/deny rules for web_search_read
[rules]
allowed_schemes = ["http", "https"]

allowed_domains = [
    "wikipedia.org",
    "*.wikipedia.org",
    "github.com",
    "*.github.com",
    "python.org",
    "*.python.org",
    "kun.uz",
    "daryo.uz",
    "gazeta.uz"
]

denied_domains = [
    "localhost",
    "127.0.0.1",
    "*.ts.net",
    "10.*",
    "192.168.*",
    "172.16.*"
]
