[project]
name = "cyber-agent"
version = "0.1.0"
description = "Personal voice-first Uzbek AI assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "fastapi>=0.163.1",
    "faster-whisper>=1.2.1",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "playwright>=1.65.2",
    "psutil>=7.2.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "websockets>=17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "test_backup",
    "test_killswitch",
    "test_red_team",
    "test_orchestrator",
    "test_policy",
    "test_registry",
    "test_tools",
    "test_websocket_api",
    "test_providers",
    "test_config",
    "test_audit",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

