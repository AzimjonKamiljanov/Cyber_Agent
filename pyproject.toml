[project]
name = "cyber-agent"
version = "0.1.0"
description = "Personal voice-first Uzbek AI assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "google-genai>=3.3.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "websockets>=17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

